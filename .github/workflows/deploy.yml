name: Build and Deploy

on:
  push:
    branches:
      - i18n/korean
  workflow_dispatch:
    inputs:
      build_pdf:
        description: 'PDF 빌드 포함'
        type: boolean
        required: false
        default: true
      build_epub:
        description: 'EPUB 빌드 포함'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pandoc & HTML build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make pandoc

      - name: Install TeX & Fonts for PDF
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_pdf }}
        run: |
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-korean \
            texlive-fonts-recommended \
            fonts-nanum \
            fonts-noto-cjk

      - name: Build HTML
        run: make -f Makefile.ko html

      - name: Build EPUB
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_epub }}
        run: make -f Makefile.ko epub

      - name: Build PDF
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_pdf }}
        run: make -f Makefile.ko pdf

      - name: Prepare GitHub Pages build artifacts
        run: |
          mkdir public
          cp -r build/html/* public/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Upload PDF & EPUB Artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_pdf || inputs.build_epub) }}
        uses: actions/upload-artifact@v4
        with:
          name: category-theory-for-programmers-ko-books
          path: |
            build/pdf/*.pdf
            build/epub/*.epub
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/i18n/korean')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4