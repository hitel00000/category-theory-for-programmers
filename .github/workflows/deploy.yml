name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - i18n/korean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt update
          sudo apt install -y make pandoc

      - name: Build HTML only
        run: make -f Makefile.ko html

      - name: Prepare build artifacts
        run: |
          mkdir public
          cp -r build/html/* public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4